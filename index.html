<!DOCTYPE html>
<html>
<head>
    <title>rock,paper,scissors</title>
    <link rel="stylesheet" href="styles/rock-paper-scissors.css">
</head>
<body>
    <p class="title">Rock Paper Scissors</p>
    <button class="css-button js-rock-button">
        <img class="rock" src="image/Rock-emoji.png" ></button>
    <button class="css-button js-paper-button">
        <img src="image/Paper-emoji.png" class="paper"></button>
    <button class="css-button js-scissors-button">
    <img src="image/Scissors-emoji.png" class="scissors"></button>
    <p class="js-result css-result"></p>
    <p class="js-move "></p>
    <p class="js-score css-score"></p>
    
    
    <button class="reset js-reset">
        Reset Score
    </button>
    <button class="auto-css js-auto">
        Auto Play
    </button>
    <div class="css-agree js-agree"></div>

    <script src="scripts/rock-paper-scissors.js">
    </script>
</body>
</html>
